<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница ушла за кофе, Бейджанс</title>
  <meta name="description" content="Такой страницы нет. Вернитесь на главную Бейджанса или откройте меню.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#dcdee1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/dela-gothic-one-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/styles.css">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body>
  <header class="nav">
    <div class="container nav__row">
      <a class="wordmark nav__mark" href="/" aria-label="Бейджанс, на главную">Бейджанс</a>
      <nav class="nav__links nav__links--always" aria-label="Разделы">
        <a class="ulink" href="/#menu">Меню</a>
        <a class="ulink" href="/#visit">Как добраться</a>
      </nav>
    </div>
  </header>

  <main class="lost">
    <div class="container lost__grid">
      <div class="lost__text">
        <p class="lost__xp" data-rise>+1 XP</p>
        <h1 class="lost__title" data-rise>Страница ушла за&nbsp;кофе</h1>
        <p class="lead" data-rise>Такой страницы у нас нет. Зато есть табличка на стене, капучино и выпечка до&nbsp;22:00.</p>
        <div class="hero__actions" data-rise>
          <a class="btn btn--primary" href="/"><span>На главную</span></a>
          <a class="btn btn--quiet" href="/#menu"><span>Открыть меню</span></a>
        </div>
      </div>
      <div class="salon lost__wall">
        <figure class="frame frame--canvas lost__frame" style="--i:0; --rest:-2.5deg">
          <img src="/images/place/xp-sign.webp" width="908" height="1280" alt="Световая табличка What doesn't kill you gives you XP на бетонной стене зала">
        </figure>
      </div>
    </div>
  </main>
</body>
</html>
